<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610">
  <style>
    .title { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; font-size: 24px; font-weight: bold; }
    .text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; font-size: 16px; }
    .skill-text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; font-size: 16px; font-weight: 500; text-anchor: start; }
    .pct { font-family: 'Segoe UI', Ubuntu, monospace; fill: #8b949e; font-size: 16px; font-weight: bold; text-anchor: start; }
    
    .sq { fill: #238636; rx: 4; }
    .empty { opacity: 0.15; }
    .filled { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
    
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.3s; } .d4 { animation-delay: 0.4s; }
    .d5 { animation-delay: 0.5s; } .d6 { animation-delay: 0.6s; }
    .d7 { animation-delay: 0.7s; } .d8 { animation-delay: 0.8s; }
    .d9 { animation-delay: 0.9s; } .d10 { animation-delay: 1.0s; }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Circuit Backbone */
    .circuit { stroke: #30363d; stroke-width: 2; fill: none; }
    .data-flow { stroke: #238636; stroke-width: 2; stroke-dasharray: 6, 6; animation: flowAnim 5s linear infinite; fill: none; }
    @keyframes flowAnim { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    .node { fill: #238636; }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Master Backbone -->
  <path d="M 20,0 L 20,610" class="circuit" />
  <path d="M 20,0 L 20,610" class="data-flow" />

  <!-- ================= ABOUT ME ================= -->
  <g transform="translate(0, 0)">
    <line x1="20" y1="30" x2="35" y2="30" class="circuit" />
    <circle cx="20" cy="30" r="4" class="node" />
    <text x="50" y="38" class="title">About Me</text>
    
    <g transform="translate(0, 80)">
      <line x1="20" y1="0" x2="35" y2="0" class="circuit" />
      <circle cx="20" cy="0" r="4" class="node" />
      <circle cx="35" cy="0" r="3" class="node" />
      <text x="50" y="5" class="text">Computer &amp; Network Engineering Student</text>
    </g>
    <g transform="translate(0, 120)">
      <line x1="20" y1="0" x2="35" y2="0" class="circuit" />
      <circle cx="20" cy="0" r="4" class="node" />
      <circle cx="35" cy="0" r="3" class="node" />
      <text x="50" y="5" class="text">Deeply interested in Networking &amp; Linux</text>
    </g>
    <g transform="translate(0, 160)">
      <line x1="20" y1="0" x2="35" y2="0" class="circuit" />
      <circle cx="20" cy="0" r="4" class="node" />
      <circle cx="35" cy="0" r="3" class="node" />
      <text x="50" y="5" class="text">Currently studying and preparing for CCNA</text>
    </g>
    <g transform="translate(0, 200)">
      <line x1="20" y1="0" x2="35" y2="0" class="circuit" />
      <circle cx="20" cy="0" r="4" class="node" />
      <circle cx="35" cy="0" r="3" class="node" />
      <text x="50" y="5" class="text">Enthusiastic about AI &amp; Automation</text>
    </g>
  </g>

  <!-- ================= SKILLS ================= -->
  <g transform="translate(0, 240)">
    <line x1="20" y1="30" x2="35" y2="30" class="circuit" />
    <circle cx="20" cy="30" r="4" class="node" />
    <text x="50" y="38" class="title">Skills Proficiency</text>

    <!-- Python 80% -->
    <text x="50" y="95" class="skill-text">Python</text>
    <text x="150" y="95" class="pct">80%</text>
    <line x1="20" y1="90" x2="35" y2="90" class="circuit" />
    <circle cx="20" cy="90" r="4" class="node" />
    <g transform="translate(190, 81)">
      <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
      <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
      <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
      <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
      <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
      <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
      <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
      <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
      <rect x="200" y="0" width="18" height="18" class="sq empty" />
      <rect x="225" y="0" width="18" height="18" class="sq empty" />
    </g>
    
    <!-- Networking 70% -->
    <text x="50" y="145" class="skill-text">Networking</text>
    <text x="150" y="145" class="pct">70%</text>
    <line x1="20" y1="140" x2="35" y2="140" class="circuit" />
    <circle cx="20" cy="140" r="4" class="node" />
    <g transform="translate(190, 131)">
      <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
      <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
      <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
      <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
      <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
      <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
      <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
      <rect x="175" y="0" width="18" height="18" class="sq empty" />
      <rect x="200" y="0" width="18" height="18" class="sq empty" />
      <rect x="225" y="0" width="18" height="18" class="sq empty" />
    </g>

    <!-- Linux 80% -->
    <text x="50" y="195" class="skill-text">Linux</text>
    <text x="150" y="195" class="pct">80%</text>
    <line x1="20" y1="190" x2="35" y2="190" class="circuit" />
    <circle cx="20" cy="190" r="4" class="node" />
    <g transform="translate(190, 181)">
      <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
      <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
      <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
      <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
      <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
      <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
      <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
      <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
      <rect x="200" y="0" width="18" height="18" class="sq empty" />
      <rect x="225" y="0" width="18" height="18" class="sq empty" />
    </g>

    <!-- AI & Auto 60% -->
    <text x="50" y="245" class="skill-text">AI &amp; Auto</text>
    <text x="150" y="245" class="pct">60%</text>
    <line x1="20" y1="240" x2="35" y2="240" class="circuit" />
    <circle cx="20" cy="240" r="4" class="node" />
    <g transform="translate(190, 231)">
      <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
      <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
      <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
      <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
      <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
      <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
      <rect x="150" y="0" width="18" height="18" class="sq empty" />
      <rect x="175" y="0" width="18" height="18" class="sq empty" />
      <rect x="200" y="0" width="18" height="18" class="sq empty" />
      <rect x="225" y="0" width="18" height="18" class="sq empty" />
    </g>
  </g>

  <!-- ================= TECH STACK ================= -->
  <g transform="translate(0, 520)">
    <line x1="20" y1="30" x2="35" y2="30" class="circuit" />
    <circle cx="20" cy="30" r="4" class="node" />
    <text x="50" y="38" class="title">Tech Stack</text>
    
    <line x1="20" y1="75" x2="35" y2="75" class="circuit" />
    <circle cx="20" cy="75" r="4" class="node" />
    <text x="50" y="80" class="text" style="font-weight: bold;">Languages, Systems &amp; Tools</text>
  </g>

</svg>
