<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <rect width="800" height="200" fill="#0d1117" stroke="#454040" stroke-width="1.5" rx="10"/>

  <style>
    .node-primary { fill: #E6F082; }
    .node-router { fill: #D8D365; stroke: #605B51; stroke-width: 2; }
    
    .pulse { fill: transparent; stroke: #E6F082; animation: pulseAnim 2.2s infinite ease-out; }
    .pulse-delay { fill: transparent; stroke: #D8D365; animation: pulseAnim 2.2s infinite ease-out; animation-delay: 1.1s; }
    
    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 0.9; stroke-width: 2.5px; }
      100% { transform: scale(3.5); opacity: 0; stroke-width: 0.5px; }
    }

    .line { stroke: #605B51; stroke-width: 2; stroke-dasharray: 8, 8; animation: dashAnim 4s linear infinite; fill: none; }
    .line-reverse { stroke: #605B51; stroke-width: 2; stroke-dasharray: 8, 8; animation: dashAnimReverse 4s linear infinite; fill: none; }
    
    @keyframes dashAnim {
      from { stroke-dashoffset: 80; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashAnimReverse {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 80; }
    }
    
    .text-title { fill: #E6F082; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .text-router { fill: #D8D365; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .subtext { fill: #c9d1d9; font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13px; text-anchor: middle; }
  </style>

  <!-- Line from Local to Gateway -->
  <line x1="200" y1="100" x2="400" y2="100" class="line" />
  <!-- Line from Gateway to Internet -->
  <line x1="400" y1="100" x2="600" y2="100" class="line-reverse" />

  <!-- Node 1 (Local Client) -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="0" r="14" class="pulse" />
    <circle cx="0" cy="0" r="14" class="pulse-delay" />
    <circle cx="0" cy="0" r="14" class="node-primary" />
    <text x="0" y="45" class="text-title">192.168.1.10</text>
    <text x="0" y="65" class="subtext">Client Host</text>
  </g>

  <!-- Node 2 (Core Router) -->
  <g transform="translate(400, 100)">
    <rect x="-20" y="-15" width="40" height="30" rx="6" class="node-router" />
    <text x="0" y="45" class="text-router">10.0.0.1</text>
    <text x="0" y="65" class="subtext">Core Router</text>
  </g>

  <!-- Node 3 (DNS Server) -->
  <g transform="translate(600, 100)">
    <circle cx="0" cy="0" r="14" class="pulse" />
    <circle cx="0" cy="0" r="14" class="pulse-delay" />
    <circle cx="0" cy="0" r="14" class="node-primary" />
    <text x="0" y="45" class="text-title">8.8.8.8</text>
    <text x="0" y="65" class="subtext">DNS Server</text>
  </g>

</svg>
