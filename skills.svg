<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <style>
    .text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; font-size: 15px; font-weight: 500; text-anchor: start; }
    .pct { font-family: 'Segoe UI', Ubuntu, monospace; fill: #8b949e; font-size: 15px; font-weight: bold; text-anchor: start; }
    
    .sq { fill: #238636; rx: 4; }
    .empty { opacity: 0.15; }
    .filled { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
    
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.3s; } .d4 { animation-delay: 0.4s; }
    .d5 { animation-delay: 0.5s; } .d6 { animation-delay: 0.6s; }
    .d7 { animation-delay: 0.7s; } .d8 { animation-delay: 0.8s; }
    .d9 { animation-delay: 0.9s; } .d10 { animation-delay: 1.0s; }

    @keyframes fadeIn { to { opacity: 1; } }

    /* Circuit Backbone */
    .circuit { stroke: #30363d; stroke-width: 2; fill: none; }
    .data-flow { stroke: #238636; stroke-width: 2; stroke-dasharray: 6, 6; animation: flowAnim 4s linear infinite; fill: none; }
    @keyframes flowAnim { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    .node { fill: #238636; }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Backbone -->
  <path d="M 5,0 L 5,250" class="circuit" />
  <path d="M 5,0 L 5,250" class="data-flow" />

  <!-- Python 80% -->
  <text x="30" y="45" class="text">Python</text>
  <text x="130" y="45" class="pct">80%</text>
  <line x1="5" y1="40" x2="20" y2="40" class="circuit" />
  <circle cx="5" cy="40" r="4" class="node" />
  <g transform="translate(170, 31)">
    <!-- 8 filled, 2 empty -->
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>
  
  <!-- Networking 70% -->
  <text x="30" y="95" class="text">Networking</text>
  <text x="130" y="95" class="pct">70%</text>
  <line x1="5" y1="90" x2="20" y2="90" class="circuit" />
  <circle cx="5" cy="90" r="4" class="node" />
  <g transform="translate(170, 81)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq empty" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

  <!-- Linux & Bash 80% -->
  <text x="30" y="145" class="text">Linux</text>
  <text x="130" y="145" class="pct">80%</text>
  <line x1="5" y1="140" x2="20" y2="140" class="circuit" />
  <circle cx="5" cy="140" r="4" class="node" />
  <g transform="translate(170, 131)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

  <!-- AI & Automation 60% -->
  <text x="30" y="195" class="text">AI &amp; Auto</text>
  <text x="130" y="195" class="pct">60%</text>
  <line x1="5" y1="190" x2="20" y2="190" class="circuit" />
  <circle cx="5" cy="190" r="4" class="node" />
  <g transform="translate(170, 181)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq empty" />
    <rect x="175" y="0" width="18" height="18" class="sq empty" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

</svg>
