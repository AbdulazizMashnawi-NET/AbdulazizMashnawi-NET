<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <style>
    .text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; font-size: 15px; font-weight: 500; }
    .bg-bar { fill: #21262d; rx: 6; }
    .fill-bar { rx: 6; }
    
    @keyframes fillPython { from { width: 0; } to { width: 340px; } }
    @keyframes fillNet { from { width: 0; } to { width: 300px; } }
    @keyframes fillLinux { from { width: 0; } to { width: 320px; } }
    @keyframes fillAuto { from { width: 0; } to { width: 260px; } }

    .python { animation: fillPython 1.5s ease-out forwards; fill: #3572A5; }
    .networking { animation: fillNet 1.5s ease-out forwards; fill: #238636; }
    .linux { animation: fillLinux 1.5s ease-out forwards; fill: #f1e05a; }
    .automation { animation: fillAuto 1.5s ease-out forwards; fill: #e34c26; }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Python -->
  <text x="20" y="45" class="text">Python</text>
  <rect x="170" y="32" width="400" height="16" class="bg-bar" />
  <rect x="170" y="32" width="0" height="16" class="fill-bar python" />
  
  <!-- Networking -->
  <text x="20" y="95" class="text">Networking (CCNA)</text>
  <rect x="170" y="82" width="400" height="16" class="bg-bar" />
  <rect x="170" y="82" width="0" height="16" class="fill-bar networking" />

  <!-- Linux -->
  <text x="20" y="145" class="text">Linux &amp; Bash</text>
  <rect x="170" y="132" width="400" height="16" class="bg-bar" />
  <rect x="170" y="132" width="0" height="16" class="fill-bar linux" />

  <!-- AI & Automation -->
  <text x="20" y="195" class="text">AI &amp; Automation</text>
  <rect x="170" y="182" width="400" height="16" class="bg-bar" />
  <rect x="170" y="182" width="0" height="16" class="fill-bar automation" />

</svg>
