<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <style>
    .text { font-family: 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; font-size: 15px; font-weight: 500; }
    .pct { font-family: 'Segoe UI', Ubuntu, monospace; fill: #8b949e; font-size: 15px; font-weight: bold; }
    
    .sq { fill: #238636; rx: 4; }
    .empty { opacity: 0.15; }
    .filled { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
    
    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.2s; }
    .d3 { animation-delay: 0.3s; }
    .d4 { animation-delay: 0.4s; }
    .d5 { animation-delay: 0.5s; }
    .d6 { animation-delay: 0.6s; }
    .d7 { animation-delay: 0.7s; }
    .d8 { animation-delay: 0.8s; }
    .d9 { animation-delay: 0.9s; }
    .d10 { animation-delay: 1.0s; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <!-- Python 80% -->
  <text x="20" y="45" class="text">Python</text>
  <text x="180" y="45" class="pct">80%</text>
  <g transform="translate(230, 31)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>
  
  <!-- Networking 70% -->
  <text x="20" y="95" class="text">Networking (CCNA)</text>
  <text x="180" y="95" class="pct">70%</text>
  <g transform="translate(230, 81)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq empty" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

  <!-- Linux & Bash 80% -->
  <text x="20" y="145" class="text">Linux &amp; Bash</text>
  <text x="180" y="145" class="pct">80%</text>
  <g transform="translate(230, 131)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq filled d7" />
    <rect x="175" y="0" width="18" height="18" class="sq filled d8" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

  <!-- AI & Automation 60% -->
  <text x="20" y="195" class="text">AI &amp; Automation</text>
  <text x="180" y="195" class="pct">60%</text>
  <g transform="translate(230, 181)">
    <rect x="0" y="0" width="18" height="18" class="sq filled d1" />
    <rect x="25" y="0" width="18" height="18" class="sq filled d2" />
    <rect x="50" y="0" width="18" height="18" class="sq filled d3" />
    <rect x="75" y="0" width="18" height="18" class="sq filled d4" />
    <rect x="100" y="0" width="18" height="18" class="sq filled d5" />
    <rect x="125" y="0" width="18" height="18" class="sq filled d6" />
    <rect x="150" y="0" width="18" height="18" class="sq empty" />
    <rect x="175" y="0" width="18" height="18" class="sq empty" />
    <rect x="200" y="0" width="18" height="18" class="sq empty" />
    <rect x="225" y="0" width="18" height="18" class="sq empty" />
  </g>

</svg>
